[workspace]
resolver = "3"
# apps/* = installable binaries (tacet-compositor, tacet-browser, ...)
# libs/* = internal Rust libraries shared between apps (tacet-view, ...).
members = ["crates/apps/*", "crates/libs/*"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/tacet-os/tacet-os"
authors = ["tacet-os contributors"]
rust-version = "1.85"

[profile.release]
lto = "thin"
codegen-units = 1
