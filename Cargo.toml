[workspace]
resolver = "3"
# apps/* = installable binaries (tacet-compositor, tacet-terminal, ...)
# libs/* slot reserved; add "crates/libs/*" to members when the first
# internal Rust library lands (cargo errors on empty globs, so we keep
# the pattern out until there's a Cargo.toml to match).
members = ["crates/apps/*"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/tacet-os/tacet-os"
authors = ["tacet-os contributors"]
rust-version = "1.85"

[profile.release]
lto = "thin"
codegen-units = 1
