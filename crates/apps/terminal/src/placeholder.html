<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tacet-terminal</title>
<style>
  :root { color-scheme: dark; font-family: ui-monospace, "JetBrainsMono Nerd Font", monospace; }
  body {
    margin: 0; padding: 0; background: #0c0c0d; color: #e7e7e8;
    min-height: 100vh; display: grid; place-items: center;
  }
  main { max-width: 36rem; padding: 2rem; text-align: center; }
  h1 { margin: 0 0 0.25rem; font-weight: 500; letter-spacing: -0.02em; }
  .status { margin: 0 0 1.5rem; color: #8a8a8d; font-size: 0.875rem; }
  p { line-height: 1.55; }
  code {
    background: #1a1a1c; padding: 0.1em 0.4em;
    border-radius: 0.25rem; font-size: 0.92em;
  }
</style>
</head>
<body>
<main>
  <h1>tacet-terminal</h1>
  <p class="status">v0.1.0-alpha.1 · placeholder</p>
  <p>
    Real terminal (libghostty-wasm + PTY bridge) lands in
    <code>packages/apps/terminal</code>. This window confirms
    <code>tacet-view</code> + system Chromium are wired correctly:
    contextless profile, frameless window, CDP available.
  </p>
</main>
</body>
</html>
